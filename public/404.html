<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NINEの代码space</title>
    <script>
      // GitHub Pages 404 fallback for Vue Router History mode
      // 将所有路径重写为index.html，让Vue Router接管
      (function() {
        var path = window.location.pathname;
        if (path !== '/' && !path.includes('.')) {
          window.history.replaceState({}, '', '/' + path);
          location.href = '/';
        }
      })();
    </script>
  </head>
  <body>
    <!-- This page will redirect to index.html -->
  </body>
</html>
