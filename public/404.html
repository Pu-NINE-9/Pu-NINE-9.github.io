<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NINEの代码space</title>
    <script>
      // GitHub Pages 404 fallback for Vue Router History mode
      // 将所有路径重写为index.html，让Vue Router接管
      (function() {
        var path = window.location.pathname;
        // 确保路径以单斜杠开头，避免协议相对URL问题
        var cleanPath = path.startsWith('/') ? path : '/' + path;
        if (cleanPath !== '/' && !cleanPath.includes('.')) {
          // 使用 pushState 而不是 replaceState，避免跨域问题
          window.history.pushState({}, '', cleanPath);
          location.href = '/';
        }
      })();
    </script>
  </head>
  <body>
    <!-- This page will redirect to index.html -->
  </body>
</html>
