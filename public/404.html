<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NINEの代码space</title>
    <script>
      // GitHub Pages 404 fallback for Vue Router History mode
      // 正确处理路由回退
      (function() {
        var path = window.location.pathname;
        var query = window.location.search;
        var hash = window.location.hash;
        
        // 只有当路径不是根路径且不是静态资源时才处理
        if (path !== '/' && !path.includes('.')) {
          // 使用 replaceState 保存原始路径，然后跳转到首页
          // 这样 Vue Router 加载后可以从 history.state 中获取原始路径
          window.history.replaceState({ originalPath: path + query + hash }, '', '/');
          // 直接跳转到首页，Vue Router 会处理路由
          window.location.href = '/';
        }
      })();
    </script>
  </head>
  <body>
    <!-- This page will redirect to index.html -->
  </body>
</html>
