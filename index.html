<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, email=no" />
    <meta name="description" content="NINEの代码space - Pixel Retro Personal Website" />
    <meta name="theme-color" content="#1a1a2e" />
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://visitor-badge.laobi.icu https://*.github.io; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="robots" content="index, follow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://visitor-badge.laobi.icu" />
    <link rel="preconnect" href="https://visitor-badge.laobi.icu" crossorigin />

    <link rel="preload" href="/logo.png" as="image" type="image/png" />
    <link rel="modulepreload" href="/src/main.ts" />
    
    <style>
      /* 字体加载前使用系统字体作为fallback */
      :root {
        --font-pixel-fallback: 'Courier New', Courier, monospace;
      }
      
      #initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #1a1a2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease;
      }
      
      #initial-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-spinner {
        width: 42px;
        height: 42px;
        position: relative;
      }
      
      .loading-spinner .circular {
        width: 42px;
        height: 42px;
        animation: loading-rotate 2s linear infinite;
      }
      
      .loading-spinner .path {
        stroke: #ffd700;
        stroke-width: 3;
        stroke-linecap: round;
        animation: loading-dash 1.5s ease-in-out infinite;
      }
      
      .loading-text {
        margin-top: 20px;
        font-family: var(--font-pixel-fallback);
        font-size: 12px;
        color: #ffd700;
        text-shadow: 2px 2px 0 #d92626;
        letter-spacing: 2px;
      }
      
      @keyframes loading-rotate {
        100% {
          transform: rotate(360deg);
        }
      }
      
      @keyframes loading-dash {
        0% {
          stroke-dasharray: 1, 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 90, 150;
          stroke-dashoffset: -40px;
        }
        100% {
          stroke-dasharray: 90, 150;
          stroke-dashoffset: -120px;
        }
      }
    </style>
    
    <title>NINEの代码space</title>
    
    <!-- 异步加载 Google Fonts -->
    <script>
      (function() {
        // 检测是否支持 Font Face Observer
        function loadFonts() {
          var link = document.createElement('link');
          link.href = 'https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap';
          link.rel = 'stylesheet';
          link.media = 'print';
          link.onload = function() {
            link.media = 'all';
          };
          document.head.appendChild(link);
        }
        
        // DOM加载完成后加载字体
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadFonts);
        } else {
          loadFonts();
        }
      })();
    </script>
  </head>
  <body>
    <div id="initial-loading">
      <div class="loading-spinner">
        <svg class="circular" viewBox="25 25 50 50">
          <circle class="path" cx="50" cy="50" r="20" fill="none"/>
        </svg>
      </div>
      <div class="loading-text">LOADING...</div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
